<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Cache Runtime Check</title>
  <style>
    body { background: #111827; color: #e5e7eb; font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 850px; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .hint { color: #a5b4fc; }
    .pass { color: #86efac; }
    .fail { color: #fca5a5; }
    pre { white-space: pre-wrap; background: #1f2937; border-radius: 8px; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Large map tile cache runtime check</h1>
  <p class="hint">This checks that Play/Test builds a map-wide chunk index without allocating every bitmap, paints requested chunks correctly, and evicts old bitmaps at the configured cache limit.</p>
  <pre id="results">Loading game runtime…</pre>
  <script src="../assets/js/game.js"></script>
  <script>
    (() => {
      const checks = [];
      const check = (label, passed, details = null) => checks.push({ label, passed: Boolean(passed), details });
      const world = new World();
      for (let index = 0; index < 132; index++) {
        world.addObject(new WorldObject({
          id: `streaming-ground-${index}`,
          x: index * world._tileSize,
          y: 0,
          width: GRID_SIZE,
          height: GRID_SIZE,
          color: '#787878',
          layer: 1
        }));
      }

      world.buildTileCache();
      check('Cache index covers every authored render chunk', world._tileCacheChunks.size === 132, world._tileCacheChunks.size);
      check('Building the index allocates no raster canvases', world._tiles.size === 0, world._tiles.size);

      const firstTile = world._getOrBuildRenderTile(1, 0, 0);
      const pixel = firstTile?._ctx.getImageData(16, 16, 1, 1).data;
      check('Requested chunk is painted from its map objects', Boolean(pixel && pixel[0] === 120 && pixel[1] === 120 && pixel[2] === 120 && pixel[3] === 255), pixel ? Array.from(pixel) : null);

      for (let index = 1; index < 132; index++) world._getOrBuildRenderTile(1, index, 0);
      check('Raster bitmap cache stays within its configured bound', world._tiles.size === 128, world._tiles.size);
      check('Least recently used bitmap is evicted', !world._tiles.has('1:0:0'), [...world._tiles.keys()].slice(0, 3));
      check('Most recently requested bitmap remains cached', world._tiles.has('1:131:0'), [...world._tiles.keys()].at(-1));

      const editorWorld = new World();
      for (let index = 0; index < 132; index++) {
        editorWorld.addObject(new WorldObject({
          id: `editor-ground-${index}`,
          x: index * editorWorld._tileSize,
          y: 0,
          width: GRID_SIZE,
          height: GRID_SIZE,
          color: '#787878',
          layer: 1
        }));
      }
      const editorBounds = { left: -100, top: -100, right: 612, bottom: 612 };
      editorWorld._rebuildEditorMergedCache(editorBounds);
      const firstEditorCache = editorWorld._editorMergedCache;
      const visibleCount = firstEditorCache.reduce((count, layer) => count + layer.merged.length + layer.nonMerged.length, 0);
      check('Editor meshes only objects in its camera chunk region', visibleCount === 2, visibleCount);
      editorWorld._rebuildEditorMergedCache({ left: -80, top: -80, right: 620, bottom: 620 });
      check('Editor reuses the regional mesh while the camera stays in the same chunks', editorWorld._editorMergedCache === firstEditorCache);
      editorWorld.addObject(new WorldObject({ id: 'editor-added-ground', x: 64, y: 0, layer: 1 }));
      editorWorld._rebuildEditorMergedCache(editorBounds);
      const updatedCount = editorWorld._editorMergedCache.reduce((count, layer) => count + layer.merged.length + layer.nonMerged.length, 0);
      check('Editing an object invalidates and rebuilds the regional mesh', updatedCount === 3, updatedCount);

      const opacityWorld = new World();
      const opacityBlock = opacityWorld.addObject(new WorldObject({ id: 'opacity-ground', x: 0, y: 0, color: '#787878' }));
      opacityBlock._mechanicsOpacity = 0.25;
      opacityWorld.buildTileCache();
      const fadedPixel = opacityWorld._getOrBuildRenderTile(1, 0, 0)?._ctx.getImageData(16, 16, 1, 1).data;
      check('Static cached ground renders Mechanics opacity', Boolean(fadedPixel && fadedPixel[3] >= 63 && fadedPixel[3] <= 65), fadedPixel ? Array.from(fadedPixel) : null);
      opacityWorld.resetMechanicsObjectStates();
      check('Reset invalidates the static tile cache', opacityWorld._tileCacheReady === false && opacityWorld._tileCacheChunks.size === 0);
      opacityWorld.buildTileCache();
      const restoredPixel = opacityWorld._getOrBuildRenderTile(1, 0, 0)?._ctx.getImageData(16, 16, 1, 1).data;
      check('Reset restores authored opacity in the rebuilt static cache', Boolean(restoredPixel && restoredPixel[3] === 255), restoredPixel ? Array.from(restoredPixel) : null);

      const passed = checks.every(item => item.passed);
      const output = document.getElementById('results');
      output.className = passed ? 'pass' : 'fail';
      output.textContent = `${passed ? 'PASS' : 'FAIL'} (${checks.filter(item => item.passed).length}/${checks.length})\n` +
        checks.map(item => `${item.passed ? 'PASS' : 'FAIL'} ${item.label}${item.details === null ? '' : `: ${JSON.stringify(item.details)}`}`).join('\n');
      document.title = `${passed ? 'PASS' : 'FAIL'} — Tile Cache Runtime Check`;
    })();
  </script>
</body>
</html>
