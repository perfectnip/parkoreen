<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Parkoreen - Choose a Level">
    <title>Parkoreen - Levels</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d5a27">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/png/icons/icon-play-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/png/icons/icon-play-64.png">
    <link rel="apple-touch-icon" href="assets/png/icons/icon-play-128.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { overflow: hidden; }

        /* Header menu trigger styled like dashboard */
        .dashboard-menu-trigger {
            position: relative;
            padding: 10px 12px !important;
            min-width: 44px;
        }
        .dashboard-menu-trigger .material-symbols-outlined {
            font-size: 26px;
        }

        /* Dashboard menu panel — inlined here so the hamburger menu works on
           index.html. dashboard/index.html uses the same markup. */
        .dashboard-menu-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .dashboard-menu-backdrop.active { opacity: 1; visibility: visible; }

        .dashboard-menu-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(320px, 92vw);
            max-width: 100%;
            height: 100%;
            background: var(--bg-medium, #1a1a2e);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.35);
            z-index: 100001;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--surface-light, rgba(255,255,255,0.08));
        }
        .dashboard-menu-panel.active { transform: translateX(0); }

        .dashboard-menu-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--surface-light, rgba(255,255,255,0.08));
        }
        .dashboard-menu-panel-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary, #fff);
        }
        .dashboard-menu-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .dashboard-menu-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: var(--text-primary, rgba(255,255,255,0.9));
            font-family: inherit;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease;
            text-decoration: none;
        }
        .dashboard-menu-row:hover { background: rgba(255, 255, 255, 0.06); }
        .dashboard-menu-row .material-symbols-outlined {
            font-size: 22px;
            opacity: 0.85;
        }

        /* Big pure-SVG prev/next nav buttons */
        .levels-nav-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }
        .levels-nav-btn:hover {
            transform: scale(1.08);
            background: var(--primary);
        }
        .levels-nav-btn:active {
            transform: scale(0.92);
        }
        .levels-nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
            background: var(--surface);
        }
        .levels-nav-btn svg {
            width: 44px;
            height: 44px;
            fill: currentColor;
        }

        /* The viewport clips the horizontal group track so the active group
           remains centered between the previous/next controls. */
        .levels-viewport {
            flex: 0 1 612px;
            width: min(612px, calc(100vw - 224px));
            min-width: 0;
            overflow: hidden;
        }

        /* Groups live as a horizontal track; we slide the track on navigation */
        .levels-groups-container {
            display: flex;
            width: max-content;
            flex: 0 0 auto;
            gap: 60px;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .level-group {
            flex: 0 0 auto;
            width: 612px; /* 3 × 180 + 2 × 24 */
            display: grid;
            grid-template-columns: repeat(3, 180px);
            grid-template-rows: repeat(2, 180px);
            gap: 24px;
            justify-content: start;
        }

        /* Locked-group placeholder */
        .level-group-locked {
            flex: 0 0 auto;
            width: 612px;
            height: 384px; /* 2 × 180 + 24 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            color: var(--text-muted);
            transition: opacity 0.4s ease;
        }
        .level-group-locked svg {
            width: 160px;
            height: 160px;
            fill: var(--text-muted);
            opacity: 0.6;
        }
        .level-group-locked h2 {
            font-size: 2rem;
            margin: 0;
            font-weight: 500;
        }

        .level-card {
            width: 180px;
            height: 180px;
            background: var(--surface);
            border-radius: var(--border-radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.4s ease;
            position: relative;
            border: 3px solid transparent;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .level-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }

        .level-card:active {
            transform: translateY(-4px) scale(0.98);
        }

        .level-card.completed { border-color: var(--primary); }

        .level-card.locked {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .level-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: transparent;
        }
        .level-card.locked:active {
            transform: none;
        }

        .level-card.completed::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
        }

        .level-card-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .level-card-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .level-card-status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .level-card-download {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            cursor: pointer;
            z-index: 10;
        }
        .level-card:hover .level-card-download { opacity: 1; }
        .level-card-download:hover { background: var(--primary); }
        .level-card-download svg { width: 20px; height: 20px; fill: white; }

        /* Challenge-unlock bounce animation (Bug 8) */
        @keyframes challenge-pop {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.25); }
            60%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .challenge-card-unlock-anim {
            animation: challenge-pop 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        /* Group indicator dots */
        .group-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .group-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--surface-light);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .group-dot:hover { background: var(--text-muted); }
        .group-dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        @media (max-width: 850px) {
            .level-group, .level-group-locked {
                width: min(612px, calc(100vw - 224px));
            }
            .level-group {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }
            .level-card { width: 100%; height: auto; aspect-ratio: 1; }
        }

        @media (max-width: 700px) {
            .page-content { gap: 8px; padding: 0 10px 20px; }
            .levels-nav-btn { width: 44px; height: 44px; }
            .levels-nav-btn svg { width: 28px; height: 28px; }
            .levels-viewport { flex: 0 1 auto; width: max(168px, calc(100vw - 148px)); }
            .levels-groups-container { gap: 16px; }
            .level-group,
            .level-group-locked {
                width: max(168px, calc(100vw - 148px));
            }
            .level-group {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
            .level-card { width: 100%; height: auto; aspect-ratio: 1; border-width: 2px; }
            .level-card-icon { font-size: clamp(30px, 9vw, 42px); margin-bottom: 6px; }
            .level-card-name { font-size: clamp(.84rem, 3.5vw, 1rem); }
            .level-card-status { font-size: .72rem; }
            .group-indicator { bottom: 12px; gap: 10px; }
            .group-dot { width: 10px; height: 10px; }
        }

        @media (max-width: 380px) {
            .page-header-left .btn { padding: 7px 9px; gap: 5px; font-size: .78rem; }
            #btn-map-editor { font-size: 0; }
            #btn-map-editor .material-symbols-outlined { font-size: 22px; }
            .page-content { gap: 6px; padding-right: 7px; padding-left: 7px; }
            .levels-nav-btn { width: 36px; height: 40px; }
            .levels-nav-btn svg { width: 24px; height: 24px; }
            .levels-viewport { width: max(136px, calc(100vw - 116px)); }
            .level-group, .level-group-locked { width: max(136px, calc(100vw - 116px)); }
        }

        /* High-impact level picker art direction, while preserving the exact
           card and group dimensions used by the navigation logic. */
        .page-container {
            background:
                radial-gradient(ellipse at 50% 44%, rgba(35, 86, 109, .2), transparent 38rem),
                radial-gradient(ellipse at 50% 112%, rgba(46, 196, 145, .12), transparent 32rem),
                linear-gradient(150deg, #070c15, #0d1828 56%, #101827);
        }
        .page-header { border-bottom-color: rgba(139, 228, 202, .13); }
        .page-title {
            background: linear-gradient(180deg, #f5fff9 15%, #88efc2 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #btn-map-editor {
            box-shadow: 0 8px 30px rgba(68, 221, 163, .22), inset 0 1px 0 rgba(255,255,255,.5);
        }
        .page-content { position: relative; }
        .levels-groups-container { align-items: center; }
        .level-group {
            padding: 12px;
            border: 1px solid rgba(184, 216, 238, .08);
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(24, 39, 60, .53), rgba(12, 21, 35, .28));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 25px 80px rgba(0,0,0,.12);
        }
        .level-card {
            isolation: isolate;
            border: 1px solid rgba(202, 225, 245, .12);
            border-radius: 24px;
            background:
                radial-gradient(ellipse at 50% 4%, rgba(110, 199, 191, .13), transparent 70%),
                linear-gradient(150deg, rgba(34, 53, 76, .98), rgba(18, 29, 46, .99));
            box-shadow: 0 14px 30px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.075);
        }
        .level-card::before {
            z-index: -1;
            background: linear-gradient(145deg, rgba(255,255,255,.11), transparent 45%, rgba(83,220,177,.025));
        }
        .level-card:nth-child(3n + 2) { background: linear-gradient(150deg, rgba(39, 48, 75, .98), rgba(19, 28, 48, .99)); }
        .level-card:nth-child(3n) { background: linear-gradient(150deg, rgba(36, 59, 68, .98), rgba(17, 34, 43, .99)); }
        .level-card:hover:not(.locked) {
            transform: translateY(-9px) scale(1.035);
            border-color: rgba(112, 238, 190, .62);
            box-shadow: 0 22px 54px rgba(0,0,0,.38), 0 0 32px rgba(79,220,166,.12), inset 0 1px 0 rgba(255,255,255,.12);
        }
        .level-card-icon {
            color: #8fe8ca;
            filter: drop-shadow(0 5px 14px rgba(90,224,173,.22));
        }
        .level-card-name { font-weight: 500; letter-spacing: -.025em; }
        .level-card-status { font-weight: 500; letter-spacing: .025em; }
        .level-card.completed { border-color: rgba(89,224,173,.65); }
        .level-card.completed::after {
            content: '✓';
            display: grid;
            place-items: center;
            color: #062116;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(89,224,173,.3);
        }
        .level-card.locked { filter: saturate(.55); }
        .levels-nav-btn {
            color: #e9f8f4;
            border: 1px solid rgba(171, 216, 228, .18);
            background: linear-gradient(145deg, rgba(38, 60, 82, .94), rgba(17, 29, 45, .96));
            box-shadow: 0 12px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
        }
        .levels-nav-btn:hover:not(:disabled) {
            color: #082117;
            background: linear-gradient(145deg, #9af4cf, #51dba7);
            box-shadow: 0 12px 38px rgba(82,220,168,.24);
        }
        .group-indicator {
            gap: 9px;
            padding: 10px 14px;
            border: 1px solid rgba(180, 207, 226, .1);
            border-radius: 999px;
            background: rgba(10, 17, 28, .72);
            box-shadow: 0 8px 28px rgba(0,0,0,.25);
            backdrop-filter: blur(12px);
        }
        .group-dot { width: 8px; height: 8px; }
        .group-dot.active { width: 25px; border-radius: 999px; }
        .level-card:focus-visible,
        .levels-nav-btn:focus-visible,
        .group-dot:focus-visible {
            outline: 3px solid #a4f3d0;
            outline-offset: 4px;
        }
        @media (prefers-reduced-motion: no-preference) {
            .level-card { animation: level-card-arrive 450ms cubic-bezier(.2,.8,.2,1) backwards; }
            .level-card:nth-child(2) { animation-delay: 35ms; }
            .level-card:nth-child(3) { animation-delay: 70ms; }
            .level-card:nth-child(4) { animation-delay: 105ms; }
            .level-card:nth-child(5) { animation-delay: 140ms; }
            .level-card:nth-child(6) { animation-delay: 175ms; }
            .levels-viewport { animation: level-viewport-arrive 420ms cubic-bezier(.2,.8,.2,1) both; }
            .levels-nav-btn { animation: level-nav-arrive 420ms cubic-bezier(.2,.8,.2,1) both; }
            #btn-prev { animation-delay: 90ms; }
            #btn-next { animation-delay: 150ms; }
            .group-indicator { animation: level-indicator-arrive 380ms 180ms cubic-bezier(.2,.8,.2,1) both; }
            .group-dot { transition: transform 180ms cubic-bezier(.2,.8,.2,1), width 180ms ease, background-color 180ms ease; }
            .group-dot:hover { transform: scale(1.35); }
            .levels-nav-btn:hover:not(:disabled) svg { animation: level-arrow-nudge 320ms ease both; }
            #btn-prev:hover:not(:disabled) svg { animation-name: level-arrow-nudge-left; }

            @keyframes level-viewport-arrive {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes level-nav-arrive {
                from { filter: blur(3px); }
                to { filter: none; }
            }
            @keyframes level-indicator-arrive {
                from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.96); }
                to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            }
            @keyframes level-arrow-nudge {
                50% { transform: translateX(3px); }
            }
            @keyframes level-arrow-nudge-left {
                50% { transform: translateX(-3px); }
            }
            @keyframes level-card-arrive {
                from { opacity: 0; transform: translateY(12px) scale(.97); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
        }
        @media (max-width: 700px) {
            .level-group { padding: 7px; border-radius: 22px; gap: 10px; }
            .level-card { border-radius: 17px; }
            .levels-nav-btn { border-radius: 15px; }
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="page-container">
        <header class="page-header">
            <div class="page-header-left">
                <a href="index.html" class="btn btn-secondary">
                    <span class="material-symbols-outlined">home</span>
                    Home
                </a>
                <a href="join.html" class="btn btn-secondary">
                    <span class="material-symbols-outlined">play_arrow</span>
                    Join
                </a>
            </div>
            <h1 class="page-title">Parkoreen</h1>
            <div class="page-header-right">
                <a class="btn btn-primary" id="btn-map-editor" href="dashboard/">
                    <span class="material-symbols-outlined">construction</span>
                    Level Editor
                </a>
                <button class="btn btn-secondary dashboard-menu-trigger" id="btn-menu" type="button" title="Menu" aria-label="Open menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </header>

        <main class="page-content" style="display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <button class="levels-nav-btn" id="btn-prev" type="button" disabled aria-label="Previous level group" title="Previous level group" aria-controls="levels-viewport">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>

            <div class="levels-viewport" id="levels-viewport" aria-label="Level groups">
                <div class="levels-groups-container" id="levels-container">
                    <!-- Level groups will be inserted here -->
                </div>
            </div>

            <button class="levels-nav-btn" id="btn-next" type="button" aria-label="Next level group" title="Next level group" aria-controls="levels-viewport">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
        </main>

        <div class="group-indicator" id="group-indicator">
            <!-- Dots will be inserted here -->
        </div>
    </div>

    <!-- Menu Panel -->
    <div class="dashboard-menu-backdrop" id="dash-menu-backdrop"></div>
    <aside class="dashboard-menu-panel" id="dash-menu-panel" aria-hidden="true">
        <div class="dashboard-menu-panel-header">
            <h2 class="dashboard-menu-panel-title">Menu</h2>
            <button type="button" class="btn btn-icon btn-ghost" id="dash-menu-close" aria-label="Close menu">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="dashboard-menu-panel-body">
            <a href="community/" class="dashboard-menu-row" style="text-decoration:none;">
                <span class="material-symbols-outlined">public</span>
                <span>Community</span>
            </a>
            <a href="join.html" class="dashboard-menu-row" style="text-decoration:none;">
                <span class="material-symbols-outlined">groups</span>
                <span>Public Lobbies</span>
            </a>
            <a href="wiki/" target="_blank" class="dashboard-menu-row">
                <span class="material-symbols-outlined">menu_book</span>
                <span>Guide</span>
            </a>
            <a href="wiki/changelog/" target="_blank" class="dashboard-menu-row">
                <span class="material-symbols-outlined">history</span>
                <span>Changelog</span>
            </a>
        </div>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="runtime.js?v=29"></script>
    <script src="assets/js/mechanicsData.js?v=6"></script>
    <script src="assets/js/exportImport.js?v=20"></script>
    <script>
        // Level Groups Data
        const LEVEL_GROUPS = [
            { id: 0, name: 'Group 1', levels: ['0_1', '0_2', '0_3'] },
            { id: 1, name: 'Group 2', levels: ['1_1', '1_2', '1_3', '1_x_challenge_level'] },
            { id: 2, name: 'Group 3', levels: ['2_1', '2_2', '2_x_challenge_level'] },
            { id: 3, name: 'Group 4', levels: ['3_1', '3_2', '3_3', '3_4', '3_5', '3_6_rainbow_tower'] }
        ];

        const LEVEL_BASE_PATH = 'assets/pkrn/levels/';

        // State
        let currentGroup = 0;
        let completedLevels = new Set();
        let group1Completed = false;

        // DOM Elements
        const container = document.getElementById('levels-container');
        const indicator = document.getElementById('group-indicator');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnMenu = document.getElementById('btn-menu');
        const menuPanel = document.getElementById('dash-menu-panel');
        const menuBackdrop = document.getElementById('dash-menu-backdrop');
        const menuClose = document.getElementById('dash-menu-close');

        // Load progress from API (account) or localStorage (guest fallback)
        async function loadProgress() {
            // Keep a local copy as a recovery source. The account endpoint can
            // be briefly unavailable, and older builds could also overwrite a
            // newer local completion with an empty server response.
            let cachedProgress = { completed: [], group1Completed: false };
            try {
                const saved = JSON.parse(localStorage.getItem('parkoreen_level_progress') || '{}');
                cachedProgress = {
                    completed: Array.isArray(saved.completed) ? saved.completed : [],
                    group1Completed: !!saved.group1Completed
                };
            } catch (e) {}

            // Check if user is logged in via runtime.js settings
            const isLoggedIn = window.Settings && window.Settings.user && window.Settings.user.id;

            if (isLoggedIn) {
                try {
                    const token = localStorage.getItem('parkoreen_token');
                    const response = await fetch(window.Settings.apiUrl + '/level-progress', {
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        completedLevels = new Set([
                            ...cachedProgress.completed,
                            ...(Array.isArray(data.completed) ? data.completed : [])
                        ]);
                        group1Completed = cachedProgress.group1Completed || !!data.group1Completed;
                        const group0Complete = LEVEL_GROUPS[0].levels.every(level => completedLevels.has(level));
                        group1Completed = group1Completed || group0Complete;
                        localStorage.setItem('parkoreen_level_progress', JSON.stringify({
                            completed: Array.from(completedLevels),
                            group1Completed
                        }));
                        const serverCompleted = new Set(Array.isArray(data.completed) ? data.completed : []);
                        if (Array.from(completedLevels).some(level => !serverCompleted.has(level))) {
                            // Restore locally cached completions to the account.
                            // The Worker merges this with its stored progress.
                            fetch(window.Settings.apiUrl + '/level-progress', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + localStorage.getItem('parkoreen_token')
                                },
                                body: JSON.stringify({
                                    completed: Array.from(completedLevels),
                                    group1Completed
                                })
                            }).catch(() => {});
                        }
                        return;
                    }
                } catch (e) {
                    console.error('Failed to load progress from API:', e);
                }
            }

            // Fallback to localStorage for guests or on error
            completedLevels = new Set(cachedProgress.completed);
            group1Completed = cachedProgress.group1Completed || LEVEL_GROUPS[0].levels.every(level => completedLevels.has(level));
        }

        // Save progress to API (account) or localStorage (guest fallback)
        async function saveProgress() {
            const progress = {
                completed: Array.from(completedLevels),
                group1Completed
            };
            // Persist immediately, before attempting the network, so a Worker
            // outage cannot make a completed level look unfinished next visit.
            localStorage.setItem('parkoreen_level_progress', JSON.stringify(progress));

            const isLoggedIn = window.Settings && window.Settings.user && window.Settings.user.id;

            if (isLoggedIn) {
                try {
                    const token = localStorage.getItem('parkoreen_token');
                    const response = await fetch(window.Settings.apiUrl + '/level-progress', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify(progress)
                    });
                    if (response.ok) {
                        return;
                    }
                } catch (e) {
                    console.error('Failed to save progress to API:', e);
                }
            }

            // The local copy above is the guest fallback and outage recovery.
        }

        // Show loading screen
        function showLoading(text) {
            // Could show a toast or overlay here
            console.log('Loading:', text);
        }

        // Hide loading screen
        function hideLoading() {
            // No-op now
        }

        // Get highest unlocked level (first uncompleted after completed)
        // Challenge levels unlock when all non-challenge levels in the group are completed.
        // The first level of a non-group-0 unlocks when all non-challenge levels of the
        // previous group are completed (challenge is optional — the user's spec).
        function isUnlocked(groupIndex, levelIndex) {
            // Defensive: ensure indices are valid
            if (!LEVEL_GROUPS[groupIndex] || !LEVEL_GROUPS[groupIndex].levels[levelIndex]) {
                return false;
            }
            const levelName = LEVEL_GROUPS[groupIndex].levels[levelIndex];

            // Group 0 (0_1, 0_2, 0_3) is ALWAYS unlocked so brand-new users have something to play.
            if (LEVEL_GROUPS[groupIndex] && LEVEL_GROUPS[groupIndex].id === 0) return true;

            // Recovery path for returning players whose account progress was
            // lost or could not sync. `has_visited` is set only when the player
            // first enters the tutorial, so keep the first post-tutorial level
            // available instead of leaving every campaign group inaccessible.
            if (groupIndex === 1 && levelIndex === 0 && localStorage.getItem('parkoreen_has_visited')) {
                return true;
            }

            if (completedLevels.has(levelName)) return false; // already completed

            // Check if this is a challenge level (contains 'challenge' case-insensitive)
            const isChallenge = levelName.toLowerCase().includes('challenge');

            if (isChallenge) {
                // Challenge unlocks when ALL non-challenge levels in this group are completed
                const nonChallengeLevels = LEVEL_GROUPS[groupIndex].levels.filter(l => !l.toLowerCase().includes('challenge'));
                return nonChallengeLevels.every(l => completedLevels.has(l));
            } else {
                // Regular level unlocks when previous level in sequence is completed
                if (levelIndex === 0) {
                    // First level in group: previous group's non-challenge levels all done
                    // (or it's group 0, which is always unlocked).
                    if (groupIndex === 0) return true;
                    const prevGroup = LEVEL_GROUPS[groupIndex - 1];
                    const prevNonChallenge = prevGroup.levels.filter(l => !l.toLowerCase().includes('challenge'));
                    return prevNonChallenge.every(l => completedLevels.has(l));
                }

                const prevLevelName = LEVEL_GROUPS[groupIndex].levels[levelIndex - 1];
                const prevIsChallenge = prevLevelName.toLowerCase().includes('challenge');

                if (prevIsChallenge) {
                    // Previous is challenge - need challenge completed
                    return completedLevels.has(prevLevelName);
                } else {
                    // Previous is regular level - just need it completed
                    return completedLevels.has(prevLevelName);
                }
            }
        }

        function getHighestUnlockedLevel() {
            for (let g = 0; g < LEVEL_GROUPS.length; g++) {
                for (let l = 0; l < LEVEL_GROUPS[g].levels.length; l++) {
                    if (isUnlocked(g, l)) {
                        return { group: g, level: l, levelId: LEVEL_GROUPS[g].levels[l] };
                    }
                }
            }
            // All completed - return last level
            const lastGroup = LEVEL_GROUPS[LEVEL_GROUPS.length - 1];
            const lastLevel = lastGroup.levels[lastGroup.levels.length - 1];
            return { group: LEVEL_GROUPS.length - 1, level: lastGroup.levels.length - 1, levelId: lastLevel };
        }

        // Play the appropriate level based on progress (direct entry)
        async function playBasedOnProgress() {
            showLoading('Loading...');

            const { group, level, levelId } = getHighestUnlockedLevel();

            try {
                const response = await fetch(LEVEL_BASE_PATH + levelId + '.pkrn');
                if (!response.ok) throw new Error('Level not found');

                const buffer = await response.arrayBuffer();
                const importManager = new ImportManager();
                const data = await importManager.importFromFile(new File([buffer], levelId + '.pkrn'));

                sessionStorage.setItem('parkoreen_current_level', JSON.stringify(data));
                sessionStorage.setItem('parkoreen_current_level_name', levelId);
                sessionStorage.setItem('parkoreen_enter_level_direct', 'true');

                hideLoading();
                window.location.href = 'host.html?mode=play&level=true';
            } catch (err) {
                hideLoading();
                console.error('Failed to load level:', err);
                alert('Failed to load level: ' + err.message);
            }
        }

        // Render level groups
        let groupStride = 612 + 60; // width + gap, cached after first render

        function isAnyLevelAccessible(groupIndex) {
            const group = LEVEL_GROUPS[groupIndex];
            // Defensive: ensure group/levels exist
            if (!group || !Array.isArray(group.levels)) return false;

            // First level of group 0 is ALWAYS accessible (so brand-new users
            // can always start playing, regardless of any state weirdness).
            if (groupIndex === 0) return true;

            for (let i = 0; i < group.levels.length; i++) {
                const name = group.levels[i];
                if (completedLevels.has(name)) return true;
                if (isUnlocked(groupIndex, i)) return true;
            }
            return false;
        }

        function measureGroupStride() {
            const firstNode = container.firstElementChild;
            if (!firstNode) return;
            const width = firstNode.getBoundingClientRect().width || 612;
            const gap = parseFloat(getComputedStyle(container).columnGap) || 0;
            groupStride = width + gap;
            container.style.transform = `translateX(${-currentGroup * groupStride}px)`;
        }

        function renderLevelGroups() {
            container.innerHTML = '';

            LEVEL_GROUPS.forEach((group, groupIndex) => {
                const accessible = isAnyLevelAccessible(groupIndex);

                if (!accessible) {
                    // Locked group: show a big lock icon + "Locked" text instead
                    // of any level cards.
                    const lockedEl = document.createElement('div');
                    lockedEl.className = 'level-group-locked';
                    lockedEl.dataset.group = groupIndex;
                    lockedEl.innerHTML = `
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <h2>Locked</h2>
                    `;
                    container.appendChild(lockedEl);
                    return;
                }

                const groupEl = document.createElement('div');
                groupEl.className = 'level-group';
                groupEl.dataset.group = groupIndex;

                group.levels.forEach((levelName, levelIndex) => {
                    const isCompleted = completedLevels.has(levelName);
                    const isLocked = !isCompleted && !isUnlocked(groupIndex, levelIndex);
                    const card = document.createElement('div');
                    card.className = 'level-card' + (isCompleted ? ' completed' : '') + (isLocked ? ' locked' : '');
                    card.dataset.level = levelName;
                    card.dataset.group = groupIndex;

                    const displayName = levelName.startsWith(group.id + '_')
                        ? 'Level ' + (levelIndex + 1)
                        : levelName.replace(/^[0-9]_/, '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                    const icon = isCompleted ? 'check_circle' : (isLocked ? 'lock' : 'play_circle');
                    const status = isCompleted ? 'Completed' : (isLocked ? 'Locked' : 'Play');

                    card.innerHTML = `
                        <span class="level-card-icon material-symbols-outlined">${icon}</span>
                        <span class="level-card-name">${displayName}</span>
                        <span class="level-card-status">${status}</span>
                        <div class="level-card-download" title="Download map">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </div>
                    `;

                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.level-card-download')) {
                            downloadLevel(levelName);
                            return;
                        }
                        // Always allow playing group 0 levels (0_1, 0_2, 0_3), and any level that's
                        // currently unlocked. Defensive against stale state.
                        const isGroup0 = LEVEL_GROUPS[groupIndex] && LEVEL_GROUPS[groupIndex].id === 0;
                        if (isGroup0 || !isLocked) {
                            playLevel(levelName);
                        }
                    });

                    groupEl.appendChild(card);
                });

                container.appendChild(groupEl);
            });

            // Render indicator dots
            indicator.innerHTML = '';
            LEVEL_GROUPS.forEach((group, index) => {
                const dot = document.createElement('div');
                dot.className = 'group-dot' + (index === 0 ? ' active' : '');
                dot.dataset.group = index;
                dot.addEventListener('click', () => goToGroup(index));
                indicator.appendChild(dot);
            });

            // Measure the responsive group width and gap for slide navigation.
            requestAnimationFrame(measureGroupStride);
        }

        // Update indicator/dots/nav-button state for the current group
        function updateGroupVisibility() {
            const dots = indicator.querySelectorAll('.group-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentGroup);
            });
            btnPrev.disabled = currentGroup === 0;
            btnNext.disabled = currentGroup === LEVEL_GROUPS.length - 1;
        }

        // Slide to a specific group. Pure horizontal scroll: forward = current
        // group scrolls out to the left, next group scrolls in from the right.
        // Reverse direction for going back.
        function goToGroup(groupIndex) {
            if (groupIndex < 0 || groupIndex >= LEVEL_GROUPS.length) return;
            currentGroup = groupIndex;
            const offset = -groupIndex * groupStride;
            container.style.transform = `translateX(${offset}px)`;
            updateGroupVisibility();
        }

        window.addEventListener('resize', () => requestAnimationFrame(measureGroupStride));

        // Navigate to previous group
        function prevGroup() {
            if (currentGroup > 0) {
                goToGroup(currentGroup - 1);
            }
        }

        // Navigate to next group
        function nextGroup() {
            if (currentGroup < LEVEL_GROUPS.length - 1) {
                goToGroup(currentGroup + 1);
            }
        }

        // Play a level
        async function playLevel(levelName) {
            showLoading('Loading ' + levelName + '...');

            try {
                // Load the level file
                const response = await fetch(LEVEL_BASE_PATH + levelName + '.pkrn');
                if (!response.ok) {
                    throw new Error('Level not found');
                }

                const buffer = await response.arrayBuffer();
                const importManager = new ImportManager();
                const data = await importManager.importFromFile(new File([buffer], levelName + '.pkrn'));

                // Store level data in sessionStorage for host.html to load
                sessionStorage.setItem('parkoreen_current_level', JSON.stringify(data));
                sessionStorage.setItem('parkoreen_current_level_name', levelName);
                sessionStorage.removeItem('parkoreen_enter_level_direct');

                // Navigate to host.html in play mode
                hideLoading();
                window.location.href = 'host.html?mode=play&level=true';
            } catch (err) {
                hideLoading();
                console.error('Failed to load level:', err);
                alert('Failed to load level: ' + err.message);
            }
        }

        // Download level as .pkrn file
        async function downloadLevel(levelName) {
            try {
                const response = await fetch(LEVEL_BASE_PATH + levelName + '.pkrn');
                if (!response.ok) {
                    throw new Error('Level not found');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = levelName + '.pkrn';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Failed to download level:', err);
                alert('Failed to download level');
            }
        }

        // Mark level as completed
        async function completeLevel(levelName) {
            completedLevels.add(levelName);

            // Check if group 1 (group 0) is completed
            const group0Levels = LEVEL_GROUPS[0].levels;
            const allGroup0Completed = group0Levels.every(l => completedLevels.has(l));
            if (allGroup0Completed && !group1Completed) {
                group1Completed = true;
            }

            await saveProgress();
            renderLevelGroups();
            updateGroupVisibility();
        }

        // Toggle menu
        function openMenu() {
            menuBackdrop.classList.add('active');
            menuPanel.classList.add('active');
            menuPanel.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            menuBackdrop.classList.remove('active');
            menuPanel.classList.remove('active');
            menuPanel.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        // Initialize
        async function init() {
            await loadProgress();
            renderLevelGroups();
            updateGroupVisibility();

            // Event listeners
            btnPrev.addEventListener('click', prevGroup);
            btnNext.addEventListener('click', nextGroup);
            btnMenu.addEventListener('click', openMenu);
            menuBackdrop.addEventListener('click', closeMenu);
            menuClose.addEventListener('click', closeMenu);

            // Bug 3 (auto-continue): runtime.js redirects here with
            // `?continue=<levelId>` when the user has unfinished group-0
            // levels. We jump them straight into that level.
            const params = new URLSearchParams(window.location.search);
            const continueLevel = params.get('continue');
            if (continueLevel) {
                // Strip the query so we don't loop back if user reloads.
                const cleanUrl = window.location.pathname;
                window.history.replaceState({}, '', cleanUrl);
                playLevel(continueLevel);
                return;
            }

            // Bug 3/8: If we got here with a pending level completion (Next
            // Level pressed on the last non-challenge level), record it and
            // run the challenge-unlock animation.
            const pendingComplete = sessionStorage.getItem('parkoreen_pending_complete');
            if (pendingComplete) {
                sessionStorage.removeItem('parkoreen_pending_complete');
                await completeLevel(pendingComplete);
                // Re-render so the just-completed card reflects its new state.
                renderLevelGroups();
                runChallengeUnlockAnimation(pendingComplete);
                return;
            }

            // Bug 4 (legacy path): if coming back from completing 0_3 with
            // the special flag set, complete it (server already recorded it
            // via host.html's postMessage, but if not, this is the fallback).
            const specialReturn = sessionStorage.getItem('parkoreen_level_complete_special');
            if (specialReturn === 'true') {
                sessionStorage.removeItem('parkoreen_level_complete_special');
                await completeLevel('0_3');
                renderLevelGroups();
                goToGroup(2);
                runChallengeUnlockAnimation('0_3');
                return;
            }

            // Bug 4: First-ever visit auto-plays the first level. We use a
            // stable localStorage flag instead of document.referrer so this
            // behaves identically at `/` and `/index.html`.
            const hasVisited = localStorage.getItem('parkoreen_has_visited');
            if (!hasVisited && completedLevels.size === 0) {
                localStorage.setItem('parkoreen_has_visited', 'true');
                playBasedOnProgress();
                return;
            }
        }

        // Bug 8: Challenge level unlock animation. When the user just
        // completed the last non-challenge level in a group, animate the
        // challenge card (if any), then slide to the next group and fade its
        // locked placeholder into the level grid.
        async function runChallengeUnlockAnimation(fromLevel) {
            const fromGroup = LEVEL_GROUPS.findIndex(g => g.levels.includes(fromLevel));
            if (fromGroup === -1) return;

            const challengeName = LEVEL_GROUPS[fromGroup].levels.find(
                l => l.toLowerCase().includes('challenge')
            );

            // Phase 1: particle burst + bounce on the challenge card (if any)
            if (challengeName) {
                const card = container.querySelector(`.level-card[data-level="${challengeName}"]`);
                if (card) {
                    spawnUnlockParticles(card);
                    card.classList.add('challenge-card-unlock-anim');
                    await wait(600);
                    card.classList.remove('locked');
                    card.classList.add('completed'); // challenge becomes available
                    await wait(200);
                }
            }

            // Phase 2: slide to next group (pure horizontal scroll, no fade)
            const nextGroup = fromGroup + 1;
            if (nextGroup < LEVEL_GROUPS.length) {
                await wait(400);
                goToGroup(nextGroup);
                // The next group may have been showing a locked placeholder.
                // Fade the placeholder out and the grid in (400ms each, slight overlap).
                const lockedNode = container.children[nextGroup];
                if (lockedNode && lockedNode.classList.contains('level-group-locked')) {
                    // Re-render so the now-unlocked group renders as a grid.
                    renderLevelGroups();
                    // Re-apply the current group's transform after re-render.
                    container.style.transform = `translateX(${-nextGroup * groupStride}px)`;
                    // Fade the now-unlocked placeholder out — wait, after re-render
                    // it's already gone. The locked placeholder was replaced by
                    // a real grid. Nothing more to do here; the slide itself
                    // provides the visual transition.
                }
            }
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Particle burst animation for the challenge unlock. Particles are
        // rendered as absolutely positioned DOM nodes and animate via
        // requestAnimationFrame, then are removed from the DOM.
        function spawnUnlockParticles(targetCard) {
            const rect = targetCard.getBoundingClientRect();
            const layer = document.createElement('div');
            layer.style.cssText = `
                position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            `;
            document.body.appendChild(layer);

            const colors = ['#4ECDC4', '#FFD93D', '#FF6B6B', '#A8E6CF', '#C7CEEA'];
            const particles = [];
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            for (let i = 0; i < 36; i++) {
                const angle = (Math.PI * 2 * i) / 36 + (Math.random() - 0.5) * 0.4;
                const speed = 100 + Math.random() * 200;
                const p = document.createElement('div');
                const size = 6 + Math.random() * 6;
                p.style.cssText = `
                    position: absolute;
                    left: ${cx}px; top: ${cy}px;
                    width: ${size}px; height: ${size}px;
                    border-radius: 50%;
                    background: ${colors[i % colors.length]};
                    box-shadow: 0 0 8px ${colors[i % colors.length]};
                    transform: translate(-50%, -50%);
                    opacity: 1;
                `;
                layer.appendChild(p);
                particles.push({
                    el: p,
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.018 + Math.random() * 0.012,
                    gravity: 240
                });
            }

            let lastTime = performance.now();
            function tick(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;
                let alive = 0;
                for (const p of particles) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += p.gravity * dt;
                    p.life -= p.decay;
                    if (p.life > 0) {
                        p.el.style.left = p.x + 'px';
                        p.el.style.top = p.y + 'px';
                        p.el.style.opacity = Math.max(0, p.life);
                        alive++;
                    } else {
                        p.el.style.opacity = '0';
                    }
                }
                if (alive > 0) {
                    requestAnimationFrame(tick);
                } else {
                    layer.remove();
                }
            }
            requestAnimationFrame(tick);
        }

        // Listen for level completion messages from host.html
        window.addEventListener('message', async (e) => {
            if (e.data.type === 'levelComplete') {
                const levelName = e.data.levelName;
                await completeLevel(levelName);

                // Special handling for 0_3
                if (levelName === '0_3') {
                    // Will be handled on return to index.html via special flag
                }
            }
        });

        // Check if returning from a completed level
        init();
    </script>
</body>
</html>
