<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>Parkoreen</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #1a1a2e; }
        #parkoreen-game { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #1a1a2e; }
    </style>
</head>
<body>
    <iframe
        id="parkoreen-game"
        src="index.html"
        title="Parkoreen game"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen
        tabindex="0"></iframe>
    <script>
        // Embed Parkoreen from this origin so same-origin storage, navigation,
        // and level completion continue to work inside the frame.
        const gameFrame = document.getElementById('parkoreen-game');
        const pendingKey = 'parkoreen_pending_completions';

        function rememberCompletion(levelName) {
            if (typeof levelName !== 'string' || !/^[a-zA-Z0-9_-]{1,100}$/.test(levelName)) return;
            let pending = [];
            try {
                const saved = JSON.parse(sessionStorage.getItem(pendingKey) || '[]');
                if (Array.isArray(saved)) pending = saved.filter(name => typeof name === 'string');
            } catch (_) {}
            if (!pending.includes(levelName)) pending.push(levelName);
            sessionStorage.setItem(pendingKey, JSON.stringify(pending));
        }

        window.addEventListener('message', event => {
            if (event.origin !== window.location.origin || event.source !== gameFrame.contentWindow) return;
            if (event.data?.type === 'levelComplete') rememberCompletion(event.data.levelName);
        });
    </script>
</body>
</html>
