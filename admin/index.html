<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Parkoreen Admin Panel">
    <title>Admin - Parkoreen</title>
    <link rel="manifest" href="/parkoreen/manifest.json">
    <meta name="theme-color" content="#2d5a27">
    <link rel="icon" type="image/png" sizes="32x32" href="/parkoreen/assets/png/icons/icon-settings-32.png">
    <link rel="stylesheet" href="/parkoreen/assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        /* Global style.css sets body { overflow: hidden } for the game — re-enable scroll here */
        body.admin-page {
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 100%;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 16px 80px;
            min-height: 100vh;
        }
        .admin-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .admin-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-primary);
            flex: 1;
        }
        .admin-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-medium);
            border-radius: var(--border-radius-lg);
            padding: 4px;
            margin-bottom: 20px;
        }
        .admin-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: var(--border-radius);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .admin-tab:hover { color: var(--text-primary); }
        .admin-tab.active {
            background: var(--primary);
            color: white;
        }
        .admin-tab .material-symbols-outlined { font-size: 18px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Rooms tab */
        .room-card {
            background: var(--bg-medium);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--surface-light);
            padding: 16px;
            margin-bottom: 10px;
        }
        .room-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .room-code {
            font-family: 'Parkoreen Game', monospace;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--primary);
            font-weight: 700;
        }
        .room-info {
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .room-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .room-info .material-symbols-outlined { font-size: 16px; }
        .room-players {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .room-player-chip {
            background: var(--surface);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.78rem;
            color: var(--text-primary);
        }
        .room-player-chip.host {
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        /* Users tab */
        .users-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .users-search {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--surface-light);
            border-radius: var(--border-radius);
            background: var(--bg-medium);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .users-search:focus { border-color: var(--primary); }
        .users-search::placeholder { color: var(--text-secondary); }
        .users-search:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--surface-light);
            white-space: nowrap;
        }
        .user-table td {
            padding: 10px 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }
        .user-table tr:hover td { background: rgba(255,255,255,0.02); }
        .user-name-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .user-display-name { font-weight: 600; }
        .user-username {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .user-actions {
            display: flex;
            gap: 4px;
        }
        .user-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: var(--border-radius);
            transition: color 0.15s ease, background 0.15s ease;
        }
        .user-action-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .user-action-btn.danger:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
        .user-action-btn .material-symbols-outlined { font-size: 18px; }
        .user-stat { white-space: nowrap; }
        .map-active-rooms {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.35;
            max-width: 200px;
        }
        .map-active-rooms code {
            font-family: 'Parkoreen Game', monospace;
            font-size: 0.72rem;
            color: var(--primary);
        }
        a.map-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: var(--border-radius);
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease, background 0.15s ease;
        }
        a.map-link-btn:hover { background: rgba(255,255,255,0.08); color: var(--primary); }
        a.map-link-btn .material-symbols-outlined { font-size: 18px; }

        /* Modal */
        .admin-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .admin-modal {
            background: var(--bg-medium);
            border-radius: var(--border-radius-lg);
            width: 100%;
            max-width: 440px;
            max-height: min(90vh, 640px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 64px rgba(0,0,0,0.5);
        }
        .admin-modal-header {
            padding: 18px 20px 0;
            flex-shrink: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .admin-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            min-height: 0;
        }
        .admin-modal-body label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .admin-modal-body input,
        .admin-modal-body textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--surface-light);
            border-radius: var(--border-radius);
            background: var(--surface);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .admin-modal-body textarea { resize: vertical; min-height: 100px; }
        .admin-modal-body input:focus,
        .admin-modal-body textarea:focus { border-color: var(--primary); }
        .admin-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 20px 18px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .material-symbols-outlined {
            font-size: 48px; opacity: 0.3; display: block; margin-bottom: 12px;
        }
        .loading-state {
            text-align: center; padding: 60px 20px; color: var(--text-secondary);
        }

        /* Responsive table scroll */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .maps-tab-hint {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin: 0 0 14px;
            line-height: 1.45;
        }
    </style>
    <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="admin-page">
    <div id="spa-content" class="admin-container">
        <div class="admin-header">
            <button class="btn btn-icon btn-secondary" id="btn-back">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h2>Admin Panel</h2>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="rooms">
                <span class="material-symbols-outlined">meeting_room</span> Rooms
            </button>
            <button class="admin-tab" data-tab="users">
                <span class="material-symbols-outlined">group</span> Users
            </button>
            <button class="admin-tab" data-tab="maps">
                <span class="material-symbols-outlined">map</span> Maps
            </button>
        </div>

        <div class="tab-panel active" id="tab-rooms">
            <div class="loading-state" id="rooms-loading">Loading rooms...</div>
            <div id="rooms-content"></div>
        </div>

        <div class="tab-panel" id="tab-users">
            <div class="users-toolbar">
                <input class="users-search" id="users-search" type="text" placeholder="Search by name or username..." disabled title="Loading admin data…">
            </div>
            <div class="loading-state" id="users-loading">Loading users...</div>
            <div id="users-content"></div>
        </div>

        <div class="tab-panel" id="tab-maps">
            <p class="maps-tab-hint">Untouched auto-seeded “Sample Map” entries are hidden. After any edit or save, a map appears here.</p>
            <div class="users-toolbar">
                <input class="users-search" id="maps-search" type="text" placeholder="Search by map name or owner..." disabled title="Loading admin data…">
            </div>
            <div class="loading-state" id="maps-loading">Loading maps...</div>
            <div id="maps-content"></div>
        </div>
    </div>

    <script src="/parkoreen/runtime.js?v=29"></script>
    <script src="/parkoreen/assets/js/style.js"></script>
    <script src="/parkoreen/assets/js/spa-router.js"></script>
    <script>
        const Auth = window.Auth || {
            getToken() { return null; },
            getUser() { return null; },
            logout() {}
        };
        // API_URL is already declared in runtime.js — do not redeclare
        const Settings = window.Settings || { get() { return undefined; } };

        function isAdminGateUsername(username) {
            if (typeof window.isParkoreenAdminUsername === 'function') {
                return window.isParkoreenAdminUsername(username);
            }
            return !!username && ['jimmyqrg', 'parkoreen'].includes(String(username).toLowerCase());
        }

        if (!Auth.getToken()) {
            window.location.href = '/parkoreen/login/?redirect=' + encodeURIComponent(window.location.pathname);
        }

        /** Use `var` (not `let`) so there is no TDZ if `init()` ever runs before this line (stale cached HTML). */
        var rooms = [];
        var users = [];
        var maps = [];
        var roomsTimer = null;
        /** First-load gate: searches stay off until rooms, users, and maps have each finished their initial fetch */
        var adminInitialRoomsLoaded = false;
        var adminInitialUsersLoaded = false;
        var adminInitialMapsLoaded = false;
        var adminListsReady = false;

        function tryEnableAdminSearches() {
            if (adminListsReady) return;
            if (!adminInitialRoomsLoaded || !adminInitialUsersLoaded || !adminInitialMapsLoaded) return;
            adminListsReady = true;
            var u = document.getElementById('users-search');
            var m = document.getElementById('maps-search');
            u.disabled = false;
            u.removeAttribute('title');
            m.disabled = false;
            m.removeAttribute('title');
        }

        /** Avoid //admin/... URLs (404 on worker path match) if API_URL has a trailing slash */
        function adminApi(path) {
            var base = (typeof API_URL !== 'undefined' ? API_URL : (window.API_URL || '')).replace(/\/+$/, '');
            return base + (path.charAt(0) === '/' ? path : '/' + path);
        }

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + Auth.getToken(), 'Content-Type': 'application/json' };
        }

        function init() {
            loadRooms();
            loadUsers();
            loadMaps();
            if (roomsTimer) clearInterval(roomsTimer);
            roomsTimer = setInterval(loadRooms, 15000);
        }

        // ============================================
        // TABS
        // ============================================
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                const panel = document.getElementById('tab-' + tab.dataset.tab);
                if (panel) panel.classList.add('active');
                if (tab.dataset.tab === 'maps') loadMaps();
            });
        });

        const backBtn = document.getElementById('btn-back');
        if (backBtn) {
            backBtn.onclick = function() {
                Navigation.toDashboard();
            };
        }

        // ============================================
        // ROOMS
        // ============================================
        async function loadRooms() {
            try {
                const resp = await fetch(adminApi('/admin/rooms'), { headers: authHeaders() });
                if (!resp.ok) throw new Error();
                rooms = await resp.json();
                renderRooms();
            } catch (e) {
                document.getElementById('rooms-content').innerHTML =
                    '<div class="empty-state"><span class="material-symbols-outlined">error</span>Failed to load rooms.</div>';
            }
            document.getElementById('rooms-loading').style.display = 'none';
            adminInitialRoomsLoaded = true;
            tryEnableAdminSearches();
        }

        function renderRooms() {
            const container = document.getElementById('rooms-content');
            if (rooms.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">meeting_room</span>No active rooms.</div>';
                return;
            }
            container.innerHTML = rooms.map(r => {
                const created = r.createdAt ? new Date(r.createdAt).toLocaleTimeString() : '—';
                return `<div class="room-card">
                    <div class="room-card-top">
                        <span class="room-code">${esc(r.code)}</span>
                        <span style="font-size:0.78rem;color:var(--text-secondary)">${created}</span>
                    </div>
                    <div class="room-info">
                        <span><span class="material-symbols-outlined">person</span> ${esc(r.hostName)} (${esc(r.hostUsername)})</span>
                        <span><span class="material-symbols-outlined">group</span> ${r.playerCount}/${r.maxPlayers}</span>
                        ${r.mapName || r.mapId ? `<span><span class="material-symbols-outlined">map</span> ${r.mapName ? esc(r.mapName) : '—'}${r.mapId ? ' <span style="opacity:0.75;font-family:monospace;font-size:0.72rem;">' + esc(r.mapId) + '</span>' : ''}</span>` : ''}
                        ${r.usePassword ? '<span><span class="material-symbols-outlined">lock</span> Password</span>' : ''}
                    </div>
                    <div class="room-players">
                        ${(r.players || []).map(p =>
                            `<span class="room-player-chip ${p.isHost ? 'host' : ''}">${esc(p.name || p.username)}${p.isHost ? ' ★' : ''}</span>`
                        ).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        // ============================================
        // USERS
        // ============================================
        async function loadUsers() {
            try {
                const resp = await fetch(adminApi('/admin/users'), { headers: authHeaders() });
                if (!resp.ok) throw new Error();
                users = await resp.json();
                renderUsers();
            } catch (e) {
                document.getElementById('users-content').innerHTML =
                    '<div class="empty-state"><span class="material-symbols-outlined">error</span>Failed to load users.</div>';
            }
            document.getElementById('users-loading').style.display = 'none';
            adminInitialUsersLoaded = true;
            tryEnableAdminSearches();
        }

        function formatPlayTime(ms) {
            if (!ms || ms < 1000) return '—';
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            if (h > 0) return h + 'h ' + m + 'm';
            return m + 'm';
        }

        function renderUsers(filter) {
            const container = document.getElementById('users-content');
            let list = users;
            if (filter) {
                const q = filter.toLowerCase();
                list = users.filter(u =>
                    (u.username || '').toLowerCase().includes(q) ||
                    (u.name || '').toLowerCase().includes(q)
                );
            }

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">group</span>No users found.</div>';
                return;
            }

            container.innerHTML = `<div class="table-wrap"><table class="user-table">
                <thead><tr>
                    <th>User</th>
                    <th>Maps</th>
                    <th>Total Time</th>
                    <th>This Week</th>
                    <th>Joined</th>
                    <th>Actions</th>
                </tr></thead>
                <tbody>${list.map(u => {
                    const joined = u.createdAt ? new Date(u.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
                    return `<tr data-uid="${u.id}">
                        <td><div class="user-name-cell">
                            <span class="user-display-name">${esc(u.name)}</span>
                            <span class="user-username">@${esc(u.username)}</span>
                        </div></td>
                        <td class="user-stat">${u.mapsCount ?? 0}</td>
                        <td class="user-stat">${formatPlayTime(u.totalPlayTime)}</td>
                        <td class="user-stat">${formatPlayTime(u.weekPlayTime)}</td>
                        <td class="user-stat">${joined}</td>
                        <td><div class="user-actions">
                            <button class="user-action-btn btn-msg" data-uid="${u.id}" data-name="${esc(u.name)}" title="Send Message">
                                <span class="material-symbols-outlined">mail</span>
                            </button>
                            <button class="user-action-btn danger btn-del" data-uid="${u.id}" data-uname="${esc(u.username)}" title="Delete User">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div></td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div>`;

            container.querySelectorAll('.btn-msg').forEach(btn => {
                btn.addEventListener('click', () => openMessageModal(btn.dataset.uid, btn.dataset.name));
            });
            container.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', () => confirmDeleteUser(btn.dataset.uid, btn.dataset.uname));
            });
        }

        const usersSearchEl = document.getElementById('users-search');
        if (usersSearchEl) {
            usersSearchEl.addEventListener('input', (e) => {
                renderUsers(e.target.value);
            });
        }

        // ============================================
        // MAPS
        // ============================================
        async function loadMaps() {
            const loadingEl = document.getElementById('maps-loading');
            const mapsSearch = document.getElementById('maps-search');
            if (adminListsReady) {
                mapsSearch.disabled = true;
                mapsSearch.title = 'Loading maps…';
            }
            loadingEl.style.display = 'block';
            try {
                const resp = await fetch(adminApi('/admin/maps'), { headers: authHeaders() });
                if (!resp.ok) throw new Error();
                maps = await resp.json();
                renderMapsList();
            } catch (e) {
                document.getElementById('maps-content').innerHTML =
                    '<div class="empty-state"><span class="material-symbols-outlined">error</span>Failed to load maps.</div>';
            }
            loadingEl.style.display = 'none';
            adminInitialMapsLoaded = true;
            tryEnableAdminSearches();
            if (adminListsReady) {
                mapsSearch.disabled = false;
                mapsSearch.removeAttribute('title');
            }
        }

        function renderMapsList(filter) {
            const container = document.getElementById('maps-content');
            let list = maps;
            if (filter) {
                const q = filter.toLowerCase();
                list = maps.filter(m =>
                    (m.name || '').toLowerCase().includes(q) ||
                    (m.ownerUsername || '').toLowerCase().includes(q) ||
                    (m.ownerDisplayName || '').toLowerCase().includes(q)
                );
            }

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">map</span>No maps match.</div>';
                return;
            }

            container.innerHTML = `<div class="table-wrap"><table class="user-table">
                <thead><tr>
                    <th>Map</th>
                    <th>Owner</th>
                    <th>Active rooms</th>
                    <th>Updated</th>
                    <th>Data</th>
                    <th>Actions</th>
                </tr></thead>
                <tbody>${list.map(m => {
                    const updated = m.updatedAt ? new Date(m.updatedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '—';
                    const rooms = m.activeRooms || [];
                    const roomsHtml = rooms.length === 0
                        ? '—'
                        : rooms.map(function(ar) {
                            return '<code>' + esc(ar.code) + '</code>' + (ar.playerCount != null ? ' (' + ar.playerCount + ')' : '');
                        }).join(', ');
                    const editHref = '../host.html?map=' + encodeURIComponent(m.id) + '&admin=1';
                    const hostHref = '../host.html?map=' + encodeURIComponent(m.id) + '&mode=host&admin=1';
                    return `<tr data-map-id="${esc(m.id)}">
                        <td><div class="user-name-cell">
                            <span class="user-display-name">${esc(m.name)}</span>
                            <span class="user-username" style="font-family:monospace;font-size:0.72rem;">${esc(m.id)}</span>
                        </div></td>
                        <td><div class="user-name-cell">
                            <span class="user-display-name">${esc(m.ownerDisplayName)}</span>
                            <span class="user-username">@${esc(m.ownerUsername)}</span>
                        </div></td>
                        <td class="map-active-rooms">${roomsHtml}</td>
                        <td class="user-stat">${updated}</td>
                        <td class="user-stat">${m.hasData ? 'Yes' : 'No'}</td>
                        <td><div class="user-actions">
                            <a class="map-link-btn" href="${editHref}" title="Edit in editor"><span class="material-symbols-outlined">edit</span></a>
                            <a class="map-link-btn" href="${hostHref}" title="Open host flow"><span class="material-symbols-outlined">sports_esports</span></a>
                            <button type="button" class="user-action-btn btn-map-rename" data-id="${esc(m.id)}" data-name="${esc(m.name)}" title="Rename"><span class="material-symbols-outlined">drive_file_rename_outline</span></button>
                            <button type="button" class="user-action-btn danger btn-map-del" data-id="${esc(m.id)}" data-name="${esc(m.name)}" title="Delete"><span class="material-symbols-outlined">delete</span></button>
                        </div></td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div>`;

            container.querySelectorAll('.btn-map-rename').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    openRenameMapModal(btn.dataset.id, btn.dataset.name);
                });
            });
            container.querySelectorAll('.btn-map-del').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    confirmDeleteMap(btn.dataset.id, btn.dataset.name);
                });
            });
        }

        const mapsSearchEl = document.getElementById('maps-search');
        if (mapsSearchEl) {
            mapsSearchEl.addEventListener('input', (e) => {
                renderMapsList(e.target.value);
            });
        }

        // ============================================
        // ACTIONS
        // ============================================
        function openMessageModal(userId, displayName) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay';
            overlay.id = 'admin-modal';
            overlay.innerHTML = `<div class="admin-modal">
                <div class="admin-modal-header">Message ${esc(displayName)}</div>
                <div class="admin-modal-body">
                    <label for="msg-subject">Subject</label>
                    <input type="text" id="msg-subject" placeholder="Subject..." maxlength="200">
                    <label for="msg-body">Message</label>
                    <textarea id="msg-body" placeholder="Write your message..." maxlength="2000"></textarea>
                </div>
                <div class="admin-modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="msg-send-btn">Send</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

            document.getElementById('msg-send-btn').addEventListener('click', async () => {
                const subject = document.getElementById('msg-subject').value.trim();
                const body = document.getElementById('msg-body').value.trim();
                if (!subject || !body) return;
                const btn = document.getElementById('msg-send-btn');
                btn.disabled = true;
                btn.textContent = 'Sending...';
                try {
                    const resp = await fetch(adminApi('/admin/users/' + userId + '/mail'), {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ subject, body })
                    });
                    if (!resp.ok) throw new Error();
                    closeModal();
                    showToast('Message sent');
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Send';
                    showToast('Failed to send');
                }
            });
        }

        function confirmDeleteUser(userId, username) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay';
            overlay.id = 'admin-modal';
            overlay.innerHTML = `<div class="admin-modal">
                <div class="admin-modal-header">Delete User</div>
                <div class="admin-modal-body">
                    <p style="color:var(--text-secondary);margin:0">Are you sure you want to permanently delete <strong style="color:var(--text-primary)">@${esc(username)}</strong>? This will remove all their data, maps, and mail.</p>
                </div>
                <div class="admin-modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn" id="delete-confirm-btn" style="background:#ef4444;color:white;border:none;padding:10px 20px;border-radius:var(--border-radius);cursor:pointer;font-family:inherit;font-weight:600">Delete</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

            document.getElementById('delete-confirm-btn').addEventListener('click', async () => {
                const btn = document.getElementById('delete-confirm-btn');
                btn.disabled = true;
                btn.textContent = 'Deleting...';
                try {
                    const resp = await fetch(adminApi('/admin/users/' + userId), {
                        method: 'DELETE',
                        headers: authHeaders()
                    });
                    if (!resp.ok) throw new Error();
                    closeModal();
                    users = users.filter(u => u.id !== userId);
                    renderUsers(document.getElementById('users-search').value);
                    loadMaps();
                    showToast('User deleted');
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Delete';
                    showToast('Failed to delete');
                }
            });
        }

        function openRenameMapModal(mapId, currentName) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay';
            overlay.id = 'admin-modal';
            overlay.innerHTML = `<div class="admin-modal">
                <div class="admin-modal-header">Rename map</div>
                <div class="admin-modal-body">
                    <label for="map-rename-input">Map name</label>
                    <input type="text" id="map-rename-input" maxlength="200" value="${esc(currentName)}">
                </div>
                <div class="admin-modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="map-rename-save">Save</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
            const input = document.getElementById('map-rename-input');
            input.focus();
            input.select();

            document.getElementById('map-rename-save').addEventListener('click', async function() {
                const name = input.value.trim();
                if (!name) return;
                const btn = document.getElementById('map-rename-save');
                btn.disabled = true;
                btn.textContent = 'Saving...';
                try {
                    const resp = await fetch(adminApi('/admin/maps/' + encodeURIComponent(mapId)), {
                        method: 'PUT',
                        headers: authHeaders(),
                        body: JSON.stringify({ name: name })
                    });
                    if (!resp.ok) throw new Error();
                    closeModal();
                    showToast('Map renamed');
                    loadMaps();
                    loadRooms();
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Save';
                    showToast('Failed to rename');
                }
            });
        }

        function confirmDeleteMap(mapId, mapDisplayName) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay';
            overlay.id = 'admin-modal';
            overlay.innerHTML = `<div class="admin-modal">
                <div class="admin-modal-header">Delete map</div>
                <div class="admin-modal-body">
                    <p style="color:var(--text-secondary);margin:0">Permanently delete <strong style="color:var(--text-primary)">${esc(mapDisplayName)}</strong>? Active rooms using this map may break.</p>
                </div>
                <div class="admin-modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn" id="map-delete-confirm-btn" style="background:#ef4444;color:white;border:none;padding:10px 20px;border-radius:var(--border-radius);cursor:pointer;font-family:inherit;font-weight:600">Delete</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

            document.getElementById('map-delete-confirm-btn').addEventListener('click', async function() {
                const btn = document.getElementById('map-delete-confirm-btn');
                btn.disabled = true;
                btn.textContent = 'Deleting...';
                try {
                    const resp = await fetch(adminApi('/admin/maps/' + encodeURIComponent(mapId)), {
                        method: 'DELETE',
                        headers: authHeaders()
                    });
                    if (!resp.ok) throw new Error();
                    closeModal();
                    showToast('Map deleted');
                    loadMaps();
                    loadRooms();
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = 'Delete';
                    showToast('Failed to delete');
                }
            });
        }

        function closeModal() {
            const m = document.getElementById('admin-modal');
            if (m) m.remove();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:10px 24px;border-radius:8px;font-size:0.88rem;z-index:999999;pointer-events:none;';
            document.body.appendChild(t);
            setTimeout(() => { t.style.transition = 'opacity 0.3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        // Block non-admin users and start data loads (must run after init / helpers exist)
        (function() {
            const user = Auth.getUser();
            if (!user || !isAdminGateUsername(user.username) || Settings.get('roleMode') !== 'admin') {
                document.querySelector('.admin-container').innerHTML =
                    '<div class="empty-state"><span class="material-symbols-outlined">block</span>Access denied.</div>';
                return;
            }
            init();
        })();
    </script>
</body>
</html>
